services:
  scansnap-home:
    image: ${SCANSNAP_IMAGE:-ghcr.io/${GITHUB_REPO:-denri1994/scansnap-home-docker}:latest}
    build: .
    container_name: scansnap-home
    network_mode: host
    restart: unless-stopped
    environment:
      USER_ID: "${USER_ID:-1000}"
      GROUP_ID: "${GROUP_ID:-1000}"
      KEEP_APP_RUNNING: "${KEEP_APP_RUNNING:-1}"
      WEB_LISTENING_PORT: "${WEB_LISTENING_PORT:-6080}"
      VNC_LISTENING_PORT: "${VNC_LISTENING_PORT:-5999}"
      VNC_LOCALHOST_ONLY: "${VNC_LOCALHOST_ONLY:-1}"
      DISPLAY_WIDTH: "${DISPLAY_WIDTH:-1440}"
      DISPLAY_HEIGHT: "${DISPLAY_HEIGHT:-900}"
      DARK_MODE: "${DARK_MODE:-0}"
      WEB_HOST_CLIPBOARD_SYNC: "${WEB_HOST_CLIPBOARD_SYNC:-1}"
      SCANNER_IP: "${SCANNER_IP:-}"
      SCAN_FOLDER_WIN: 'C:\ScanSnapHome'
      OCR_LANGS: "${OCR_LANGS:-1,6}"
      SCANSNAP_INSTALLER_URL: "${SCANSNAP_INSTALLER_URL:-}"
      TZ: "${TZ:-UTC}"
      LANG: "${LANG:-en_US.UTF-8}"
      LC_ALL: "${LC_ALL:-en_US.UTF-8}"
    volumes:
      - "scansnap-prefix:/opt/scansnap/wineprefix"
      - "./data/ScanSnapHome:/opt/scansnap/wineprefix/drive_c/users/app/AppData/Roaming/PFU/ScanSnap Home"
      - "${SCANS_DIR:-./scans}:/opt/scansnap/wineprefix/drive_c/ScanSnapHome"
      - "./installer:/installer:ro"

volumes:
  scansnap-prefix:
